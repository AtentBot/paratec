# Stack Swarm do AtentBot (SaaS). Fonte de verdade do deploy — mantém as envs
# de billing/e-mail/metered DURÁVEIS via env_file (os .env NÃO vão pro git).
#
# Deploy:  docker stack deploy -c deploy/atentbot.stack.yml atentbot
# Requer, ao lado deste arquivo (em /opt/paratec/deploy/, chmod 600, gitignored):
#   - atentbot.agent.env   (todas as envs do agent: PG*, GOOGLE_API_KEY, EVOLUTION_*,
#                            VECTOR_*, STRIPE_* (teste), SMTP_*, BILLING_*/PANEL_URL, etc.)
#   - atentbot.admin.env   (envs do admin: AGENT_INTERNAL_URL etc.)
# Gerar/atualizar os .env a partir do serviço em execução:
#   docker service inspect atentbot_agent-service \
#     --format '{{range .Spec.TaskTemplate.ContainerSpec.Env}}{{println .}}{{end}}' \
#     > deploy/atentbot.agent.env
#
# Redes e volume são EXTERNOS (criados fora desta stack).

version: "3.8"

networks:
  app_network:
    external: true
  traefik_public:
    external: true

volumes:
  paratec_agent_media:
    external: true

services:
  agent-service:
    image: paratec/agent-service:90f9e9a
    env_file:
      - atentbot.agent.env
    networks:
      app_network:
        # admin e n8n chamam o agente por este hostname — NÃO remover.
        aliases:
          - paratec-agent
    volumes:
      - paratec_agent_media:/app/media
    deploy:
      replicas: 1
      restart_policy:
        condition: any

  admin:
    image: paratec/admin:e5cd876
    env_file:
      - atentbot.admin.env
    networks:
      - app_network
      - traefik_public
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=traefik_public"
        - "traefik.http.routers.atentbot.rule=Host(`atentbot.com`)"
        - "traefik.http.routers.atentbot.entrypoints=websecure"
        - "traefik.http.routers.atentbot.tls=true"
        - "traefik.http.routers.atentbot.tls.certresolver=le"
        - "traefik.http.services.atentbot.loadbalancer.server.port=3000"
